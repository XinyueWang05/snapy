name: probe macOS torchrun

on:
  push:
    branches: ["probe/**"]

jobs:
  probe:
    runs-on: macOS-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Hostname candidates, resolver cache flushed before each
        run: |
          cat > /tmp/t.py <<'EOP'
          import socket, time
          def t(name, f, *a):
              s = time.time()
              try: r = f(*a)
              except Exception as e: r = repr(e)
              print(f"{name:34s} {time.time() - s:8.3f} s  {r}", flush=True)
          h = socket.gethostname()
          print("hostname:", h)
          t("getfqdn(gethostname())", socket.getfqdn, h)
          t("getfqdn() again", socket.getfqdn)
          t("getaddrinfo(hostname)", lambda: socket.getaddrinfo(h, None)[0][4])
          EOP
          cat /etc/hosts | grep -v '^#'
          for name in localhost 127.0.0.1 snapyci; do
            [ $name = snapyci ] && echo "127.0.0.1 snapyci" | sudo tee -a /etc/hosts
            sudo scutil --set HostName $name
            sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder || true
            echo "--- $name $(date -u +%T)"; python /tmp/t.py
          done
