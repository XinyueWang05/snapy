name: probe macOS torchrun

on:
  push:
    branches: ["probe/**"]

jobs:
  probe:
    runs-on: macOS-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reverse lookups of the loopback address
        run: |
          sudo scutil --set HostName localhost
          cat > /tmp/n.py <<'EOP'
          import socket, time
          def t(name, f, *a):
              s = time.time()
              try: r = f(*a)
              except Exception as e: r = repr(e)
              print(f"{name:44s} {time.time() - s:8.3f} s  {r}", flush=True)
          t("getnameinfo(127.0.0.1, NUMERICHOST|SERV)", socket.getnameinfo, ("127.0.0.1", 29500), socket.NI_NUMERICHOST | socket.NI_NUMERICSERV)
          t("getnameinfo(127.0.0.1, NUMERICSERV)", socket.getnameinfo, ("127.0.0.1", 29500), socket.NI_NUMERICSERV)
          t("getnameinfo(::1, NUMERICSERV)", socket.getnameinfo, ("::1", 29500, 0, 0), socket.NI_NUMERICSERV)
          t("getaddrinfo(None, 29500, PASSIVE)", lambda: socket.getaddrinfo(None, 29500, flags=socket.AI_PASSIVE)[0][4])
          EOP
          python /tmp/n.py
