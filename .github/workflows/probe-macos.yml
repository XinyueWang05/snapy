name: probe macOS torchrun

on:
  push:
    branches: ["probe/**"]

jobs:
  probe:
    runs-on: macOS-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: TCPStore creation time
        run: |
          pip install 'torch==2.10.0' py-spy
          sudo scutil --set HostName localhost
          cat > /tmp/s.py <<'EOP'
          import os, sys, time, torch.distributed as d
          host, port = sys.argv[1], int(sys.argv[2])
          t = time.time()
          s = d.TCPStore(host, port, 1, True)
          print(f"TCPStore({host}) libuv={os.environ.get('TORCH_TCPSTORE_USE_LIBUV', 'default')}: {time.time() - t:.3f} s", flush=True)
          EOP
          python /tmp/s.py 127.0.0.1 29601 & p=$!
          sleep 8; sudo py-spy dump --native --pid $p 2>&1 | head -40; wait $p
          TORCH_TCPSTORE_USE_LIBUV=0 python /tmp/s.py 127.0.0.1 29602
          python /tmp/s.py localhost 29603
