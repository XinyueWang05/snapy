name: Continuous Integration

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  BUILD_TYPE: Release

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install style checkers
        run: pip install --user cpplint cppcheck clang-format==20.1.4

      - name: Cache pre-commit
        uses: actions/cache@v3
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  build-and-test:
    needs: pre-commit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macOS-latest]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        run: |
          pip install wheel numpy pyyaml pytest netcdf4
          pip install 'torch==2.10.0'
          pip install 'kintera>=2.6.3'

      - name: Install NetCDF
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y libnetcdf-dev libucx-dev nco autoconf automake libtool pkg-config
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install netcdf nco
            # each lookup of the runner's .local name takes 35 s; torchrun makes several
            sudo scutil --set HostName localhost
          fi

      - name: Install commux UCX backend
        if: runner.os == 'Linux'
        run: |
          pip install 'commux>=0.1.4' 'pinc>=0.2.0'
          python -c "import commux; commux.register(); print('commux import OK')"

      - name: Configure CMake
        run: |
          cmake -B ${{ github.workspace }}/build \
                -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
                -DCUDA=OFF \
                -DNETCDF=ON \
                -DBUILD_TESTS=ON \
                -DFULL_TESTS=${{ github.event_name != 'pull_request' && runner.os == 'Linux' && 'ON' || 'OFF' }} \
                -DSNAPY_TEST_PYTHONPATH="$(python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"

      - name: Build
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }} --parallel 4
          elif [[ "${{ github.event_name }}" != "pull_request" ]]; then
            cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }} --parallel 3
          else
            cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }} --parallel 3 \
                  --target test_eos.release test_plm.release test_gloo_one_tensor.release
          fi

      - name: Install the project
        run: pip install --no-build-isolation --no-deps .

      - name: Run C++ & Pybind tests
        run: |
          cd ${{ github.workspace }}/build/tests
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            ctest --output-on-failure -E '^test_shallow_xy_decomp$'
          elif [[ "${{ github.event_name }}" != "pull_request" ]]; then
            ctest --output-on-failure -E '^(test_straka|test_shallow_xy|test_shallow_splash|test_shock_cpu|test_run_hydro_cpu|test_mesh_multi_block\.release)$'
          else
            ctest --output-on-failure \
                  -R '^(test_(eos|plm|gloo_one_tensor)\.release|test_python_import_path_python)$'
          fi
