name: Continuous Integration

# THROWAWAY macOS diagnostic for v3/final 55cb9d0b (ci/macos-bisect-*): builds snap_release and two tests per commit
on:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  probe:
    runs-on: macOS-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: v55-diag, sha: 55cb9d0bd939b6a6a69d2459d9bd89ea028e0511, diag: "1", overlay: "", flags: ""}
          - {label: be018f65-diag, sha: be018f65b9d90b70bac792d2cb95b89266d262a7, diag: "1", overlay: "", flags: ""}
          - {label: be018f65-parent-with-test, sha: 2724a51b, diag: "", overlay: be018f65b9d90b70bac792d2cb95b89266d262a7, flags: ""}
    name: probe (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: deps
        run: |
          pip install wheel numpy pyyaml pytest netcdf4
          pip install 'torch==2.10.0'
          pip install setuptools-scm 'pyharp>=2.7.17'
          HOMEBREW_NO_AUTO_UPDATE=1 brew install netcdf
          pip install 'kintera==2.6.12'
          python -c "import kintera, torch; print('kintera', kintera.__version__, 'torch', torch.__version__)"
      - name: checkout probe commit
        run: |
          cp ci-diag/diag.py "$RUNNER_TEMP/diag.py"
          git checkout -f ${{ matrix.sha }}
          git log -1 --format='probe commit %H %s'
          if [ -n "${{ matrix.overlay }}" ]; then
            git show ${{ matrix.overlay }}:tests/test_aneos_gamma.cpp > tests/test_aneos_gamma.cpp
            grep -q 'setup_test(test_aneos_gamma)' tests/CMakeLists.txt || sed -i '' 's/^setup_test(test_eos)$/setup_test(test_eos)\nsetup_test(test_aneos_gamma)/' tests/CMakeLists.txt
            grep -n 'aneos_gamma' tests/CMakeLists.txt
          fi
          if [ -n "${{ matrix.diag }}" ]; then python "$RUNNER_TEMP/diag.py"; fi
          git status --short
      - name: configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCUDA=OFF -DNETCDF=ON -DBUILD_TESTS=ON -DCMAKE_CXX_FLAGS="${{ matrix.flags }}" 2>&1 | tail -5
      - name: build
        run: cmake --build build --parallel 3 --target snap_release test_aneos_gamma.release test_fp32_typed_constants.release > build.log 2>&1 && rc=0 || rc=$?; echo "build rc=$rc"; grep -E "warning:|error" build.log | head -40
      - name: symbols
        run: |
          nm -m build/lib/libsnap_release.dylib | grep -i ANEOSThermoImpl | c++filt | head -20 || true
          nm -m build/tests/test_aneos_gamma.release | grep -i ANEOSThermoImpl | c++filt | head -20 || true
      - name: test_aneos_gamma
        if: always()
        run: |
          cd build/tests
          ./test_aneos_gamma.release > out.txt 2>&1 && rc=0 || rc=$?
          echo "test_aneos_gamma rc=$rc"
          grep -vE '^frame [#]([3-9][0-9]|[1-9][0-9][0-9])' out.txt | head -80
      - name: test_fp32_typed_constants
        if: always()
        run: |
          cd build/tests
          ./test_fp32_typed_constants.release > out2.txt 2>&1 && rc=0 || rc=$?
          echo "test_fp32_typed_constants rc=$rc"
          grep -E 'Failure|Which is|lmars|OK|FAILED|PASSED|fused' out2.txt | head -40
