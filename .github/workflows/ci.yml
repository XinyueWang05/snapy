name: Continuous Integration

# THROWAWAY platform-only diagnosis (ci/macos-mps-bisect): test_mps_matches_cpu_python on macOS at three v3/final shas
on:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  mps:
    runs-on: macOS-latest
    strategy:
      fail-fast: false
      matrix:
        sha: [833aca420fdbde69b49093e0d2f56fa31eb2ec7f, 6529741a6c6330f1eacf89a13fb147c2ad185253, 70f6e15e44c70f76c1dc180007366a3e7a8d1a18]
    name: mps (${{ matrix.sha }})
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: checkout probe commit
        run: |
          git checkout -f ${{ matrix.sha }}
          git log -1 --format='probe commit %H %s'
      - name: deps (as the commit's ci.yml macOS job)
        run: |
          pip install wheel numpy pyyaml pytest netcdf4
          pip install 'torch==2.10.0'
          pip install setuptools-scm 'pyharp>=2.7.17'
          HOMEBREW_NO_AUTO_UPDATE=1 brew install netcdf nco
          pip install 'kintera==2.6.13'
          python -c "import torch, kintera; print('torch', torch.__version__, 'kintera', kintera.__version__, 'mps', torch.backends.mps.is_available())"
      - name: install the project
        run: pip install --no-build-isolation --no-deps .
      - name: test_mps_matches_cpu_python
        run: |
          cd tests
          python test_mps_matches_cpu.py > out.txt 2>&1 && rc=0 || rc=$?
          echo "test_mps_matches_cpu rc=$rc"
          cat out.txt | tail -60
          exit $rc
