reference-state:
  Tref: 300.
  Pref: 1.e5

# The vapor/cloud pair only exists to register a species pair with the moist
# EOS (kintera derives vapor/cloud ids from reactions). The test state is warm
# and unsaturated everywhere (p_vapor ~ 0.5 p_sat), so the saturation
# adjustment is a no-op and transport is the only active process.
species:
  - name: dry
    composition: {O: 0.42, N: 1.56, Ar: 0.01}
    cv_R: 2.5

  - name: vapor
    composition: {H: 2, O: 1}
    cv_R: 3.5

  - name: cloud
    composition: {H: 2, O: 1}
    cv_R: 9.0
    u0_R: -3430.

reactions:
  - equation: vapor <=> cloud
    type: nucleation
    rate-constant: {formula: h2o_ideal}

geometry:
  type: cartesian
  bounds: {x1min: 0., x1max: 4., x2min: 0., x2max: 1., x3min: 0., x3max: 1.}
  cells: {nx1: 4, nx2: 256, nx3: 1, nghost: 3}

distribute:
  layout: slab
  nb2: 1
  nb3: 1
  verbose: false

dynamics:
  equation-of-state:
    type: ideal-moist
    density-floor:  1.e-10
    pressure-floor: 1.e-10
    limiter: false

  reconstruct:
    vertical: {type: cp5, scale: false, shock: false}
    horizontal: {type: cp5, scale: false, shock: false}

  riemann-solver:
    type: lmars

boundary-condition:
  external:
    x1-inner: reflecting
    x1-outer: reflecting
    x2-inner: periodic
    x2-outer: periodic
    x3-inner: periodic
    x3-outer: periodic

integration:
  type: rk3
  cfl: 0.9
  implicit-scheme: 0
  nlim: 2
  tlim: 1.e9
  ncycle_out: 0

scalar:
  nvar: 1
  names: [tracer]
  reconstruct: {type: cp5, shock: false}
